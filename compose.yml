# Base stack: Postgres, the Tern app, Ollama, and Caddy for TLS.
# install.sh writes .env and deploy/generated/Caddyfile; do not edit those by
# hand while the installer is in use, edit .env and re-run ./install.sh.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tern
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tern
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - tern-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tern -d tern"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128m

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/tern:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tern:${DB_PASSWORD}@db:5432/tern
      OLLAMA_URL: http://ollama:11434
      # The app needs to know what Ollama was started with: it never sends
      # more generations at once than there are slots, and the memory meter
      # on Admin → AI model prices a slot from the cache type. Same values as
      # the ollama service below.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      CLIENT_DIST: /app/client/dist
      PORT: "3080"
      TERN_VERSION: ${TERN_VERSION:-0.1.0}
    depends_on:
      - db
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Memory headroom for a 4.5 GB box: the app itself sits around 200 MB.
    mem_limit: ${APP_MEM_LIMIT:-768m}

  ollama:
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      # How many people can be answered at the same time. Each slot holds its
      # own context window of KV cache, so this is a memory decision as much
      # as a speed one: install.sh sizes it from RAM, and
      # `./bin/tern ai-slots` sets it to one slot per person who can sign in.
      # With one slot everyone queues behind whoever asked first.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      # One model resident at a time. The default is three, which on a small
      # box means two models nobody is using are holding the memory the one
      # in use needs.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      # Halves what each slot's context costs, at close to no quality cost,
      # which is what makes several slots affordable. Needs flash attention,
      # above. q4_0 halves it again and does cost quality; f16 turns it off.
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # Ollama's own queue, once every slot is busy. The default is 512, deep
      # enough that a loaded box looks like a hung spinner for minutes; a
      # short queue answers 503 instead and the app says "busy, try again".
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-32}
    volumes:
      - tern-ollama:/root/.ollama
    mem_limit: ${OLLAMA_MEM_LIMIT:-2560m}

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - tern-caddy-data:/data
      - tern-caddy-config:/config
    depends_on:
      - app

volumes:
  tern-db:
  tern-ollama:
  tern-caddy-data:
  tern-caddy-config:
