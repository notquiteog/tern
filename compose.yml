# Base stack: Postgres, the Tern app, Ollama, and Caddy for TLS.
# install.sh writes .env and deploy/generated/Caddyfile; do not edit those by
# hand while the installer is in use, edit .env and re-run ./install.sh.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tern
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tern
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - tern-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tern -d tern"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128m

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/tern:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tern:${DB_PASSWORD}@db:5432/tern
      OLLAMA_URL: http://ollama:11434
      # The app needs to know what Ollama was started with: it never sends
      # more generations at once than there are slots, and the memory meter
      # on Admin → AI model prices a slot from the cache type. Same values as
      # the ollama service below.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # The embedding model meaning search uses. Nobody's mail is embedded
      # until they turn the feature on for themselves.
      # The embedding floor, and it must agree with config.ts's default: this
      # line WINS, because compose passes it into the container whether .env
      # names it or not. It said `all-minilm` while config.ts said
      # `qwen3-embedding:4b`, which meant every containerised install silently
      # got the small model no matter what the code defaulted to.
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-qwen3-embedding:4b}
      # The vector index. The service name resolves on the compose network;
      # an operator whose index is elsewhere overrides it in .env.
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      CLIENT_DIST: /app/client/dist
      PORT: "3080"
      TERN_VERSION: ${TERN_VERSION:-0.1.0}
    depends_on:
      - db
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Memory headroom for a 4.5 GB box: the app itself sits around 200 MB.
    mem_limit: ${APP_MEM_LIMIT:-768m}

  ollama:
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      # How many people can be answered at the same time. Each slot holds its
      # own context window of KV cache, so this is a memory decision as much
      # as a speed one: install.sh sizes it from RAM, and
      # `./bin/tern ai-slots` sets it to one slot per person who can sign in.
      # With one slot everyone queues behind whoever asked first.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      # One model resident at a time. The default is three, which on a small
      # box means two models nobody is using are holding the memory the one
      # in use needs.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      # Halves what each slot's context costs, at close to no quality cost,
      # which is what makes several slots affordable. Needs flash attention,
      # above. q4_0 halves it again and does cost quality; f16 turns it off.
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # Ollama's own queue, once every slot is busy. The default is 512, deep
      # enough that a loaded box looks like a hung spinner for minutes; a
      # short queue answers 503 instead and the app says "busy, try again".
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-32}
    volumes:
      - tern-ollama:/root/.ollama
    mem_limit: ${OLLAMA_MEM_LIMIT:-2560m}

  # The vector index. Not behind a profile: it comes up on every deployment,
  # development and production alike.
  #
  # Vectors used to live in Postgres and every search scanned all of them.
  # Measured on the dev database: 94 ms over 50,000 messages and 383 ms over
  # 200,000, of which 82% was shipping rows into Node rather than the
  # arithmetic. An index does not make the maths faster — it stops the rows
  # being sent at all.
  qdrant:
    image: docker.io/qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      # Empty here would leave the index open to anything on the compose
      # network: with no key set, GET /collections answers 200 to anybody.
      # install.sh always generates one. The entrypoint below refuses to start
      # without it rather than coming up unauthenticated, which is the failure
      # worth having — a container that will not start gets looked at, and an
      # open one does not.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      # This project does not phone home, and an index reporting collection
      # statistics to its vendor would be exactly that.
      QDRANT__TELEMETRY_DISABLED: "true"
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ -z "$$QDRANT__SERVICE__API_KEY" ]; then
          echo "QDRANT_API_KEY is empty. Refusing to start an unauthenticated vector index." >&2
          echo "Run ./install.sh, or set QDRANT_API_KEY in .env to a value from: openssl rand -hex 32" >&2
          exit 1
        fi
        exec ./qdrant
    volumes:
      - tern-qdrant:/qdrant/storage
    # Losing this volume costs a re-index, not data. Every vector is derived
    # from Postgres, `emails.embedded` records what has been done, and the
    # background pass rebuilds from there — which is why it is deliberately
    # absent from `./bin/tern backup`, and why that absence is the design
    # rather than an omission.
    mem_limit: ${QDRANT_MEM_LIMIT:-512m}

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - tern-caddy-data:/data
      - tern-caddy-config:/config
    depends_on:
      - app

volumes:
  tern-qdrant:
  tern-db:
  tern-ollama:
  tern-caddy-data:
  tern-caddy-config:
