# Base stack: Postgres, the Tern app, Ollama, and Caddy for TLS.
# install.sh writes .env and deploy/generated/Caddyfile; do not edit those by
# hand while the installer is in use, edit .env and re-run ./install.sh.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tern
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tern
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - tern-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tern -d tern"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128m

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/tern:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tern:${DB_PASSWORD}@db:5432/tern
      OLLAMA_URL: http://ollama:11434
      CLIENT_DIST: /app/client/dist
      PORT: "3080"
      TERN_VERSION: ${TERN_VERSION:-0.1.0}
    depends_on:
      - db
      - ollama
    # Memory headroom for a 4.5 GB box: the app itself sits around 200 MB.
    mem_limit: ${APP_MEM_LIMIT:-768m}

  ollama:
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - tern-ollama:/root/.ollama
    mem_limit: ${OLLAMA_MEM_LIMIT:-2560m}

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - tern-caddy-data:/data
      - tern-caddy-config:/config
    depends_on:
      - app

volumes:
  tern-db:
  tern-ollama:
  tern-caddy-data:
  tern-caddy-config:
